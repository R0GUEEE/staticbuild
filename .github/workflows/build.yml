name: build

# One job per (tool, target). The matrix comes from manifest/tools.json via
# scripts/matrix.py, so adding an architecture is a manifest edit and nothing
# else. Three runner families: ubuntu (ELF, in an alpine container), windows
# (PE, with mingw for the source builds) and macos (Mach-O, iOS).
#
# Universal files are composed after the slices: macos-universal is a fat
# carrier, windows-universal is one PE carrying both payloads.
on:
  push:
    branches: [main]
    paths: ['recipes/**', 'stub/**', 'scripts/**', 'tools/**', 'manifest/**',
            '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      statuses:
        description: 'statuses to build (ga or ga,experimental)'
        type: string
        default: 'ga'
      ids:
        description: 'comma-separated tool ids (empty = all)'
        type: string
        default: ''

concurrency:
  group: build-${{ github.ref }}-${{ inputs.ids || 'all' }}-${{ inputs.statuses || 'ga' }}
  cancel-in-progress: true

env:
  SOURCE_DATE_EPOCH: '1700000000'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.m.outputs.cells }}
      compose: ${{ steps.c.outputs.compose }}
      count: ${{ steps.m.outputs.count }}
      compose_count: ${{ steps.c.outputs.count }}
      statuses: ${{ steps.s.outputs.statuses }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: echo "statuses=${{ inputs.statuses || 'ga' }}" >> "$GITHUB_OUTPUT"
      - id: m
        run: |
          python3 scripts/matrix.py --all --status "${{ inputs.statuses || 'ga' }}" \
            --ids "${{ inputs.ids || '' }}" > /tmp/cells.json
          echo "cells=$(cat /tmp/cells.json | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 -c "import json;print(len(json.load(open('/tmp/cells.json'))['include']))")" >> "$GITHUB_OUTPUT"
      - id: c
        run: |
          python3 scripts/matrix.py --compose --status "${{ inputs.statuses || 'ga' }}" \
            --ids "${{ inputs.ids || '' }}" > /tmp/compose.json
          echo "compose=$(cat /tmp/compose.json | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 -c "import json;print(len(json.load(open('/tmp/compose.json'))['include']))")" >> "$GITHUB_OUTPUT"

  stubs:
    # The carrier is pure Go, CGO off: one host cross-builds every ELF and PE
    # stub, including windows-arm64.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: sh scripts/stub-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stubs-linux
          path: build/stub/sb-stub-*
          if-no-files-found: error

  stubs-macos:
    # Mach-O carriers, plus the fat carrier for macos-universal.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: sh scripts/stub-build.sh macos-arm64 macos-x86_64 ios-arm64
      - run: |
          if [ -f build/stub/sb-stub-macos-arm64 ] && [ -f build/stub/sb-stub-macos-x86_64 ]; then
            lipo -create -output build/stub/sb-stub-macos-universal \
              build/stub/sb-stub-macos-arm64 build/stub/sb-stub-macos-x86_64
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stubs-macos
          path: build/stub/sb-stub-*
          if-no-files-found: warn

  build:
    needs: [plan, stubs]
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.cells) }}
    runs-on: ${{ matrix.runs_on }}
    name: ${{ matrix.name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The carrier stub must exist before any recipe runs: recipes never build
      # one themselves, they expect `scripts/stub-build.sh` to have populated
      # build/stub (the stubs job does exactly that, for every target, once).
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: stubs-linux
          path: build/stub
      - uses: actions/download-artifact@v4
        if: matrix.family == 'macho'
        continue-on-error: true
        with:
          name: stubs-macos
          path: build/stub

      - uses: actions/setup-go@v5
        if: matrix.family != 'elf'
        with:
          go-version: '1.23'

      - name: toolchain (Windows)
        if: matrix.family == 'pe'
        run: |
          choco install -y --no-progress mingw zip 7zip || true
          echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"

      - name: toolchain (macOS)
        if: matrix.family == 'macho'
        run: brew install cmake ninja zstd 2>/dev/null || true

      - name: stub (fallback)
        run: |
          ls -l build/stub 2>/dev/null || true
          if [ ! -x "build/stub/sb-stub-${{ matrix.target }}" ]; then
            sh scripts/stub-build.sh "${{ matrix.target }}" || true
          fi
          ls build/stub/sb-stub-* >/dev/null 2>&1 \
            || { echo "::error::no carrier stub at all"; exit 1; }
          # an iOS cell falls back to the macOS arm64 carrier inside sb_stub

      # Alpine on arm64 cannot host GitHub's JavaScript actions, so the ELF
      # build runs in `docker run` on the host instead of a `container:` job.
      - name: build (ELF, inside docker)
        if: matrix.family == 'elf'
        run: |
          set -eu
          docker run --rm -v "$PWD:/w" -w /w \
            -e SB_JOBS=2 -e SOURCE_DATE_EPOCH=1700000000 \
            ${{ matrix.image || 'alpine:3.21' }} sh -c '
              apk add --no-cache build-base cmake ninja python3 curl git perl bash \
                zstd xz tar file unzip binutils linux-headers pkgconf > /dev/null
              # every recipe declares the packages it needs on its second line
              deps=$(sed -n "s/^# deps: //p" "recipes/${{ matrix.tool }}.sh")
              if [ -n "$deps" ] && [ "$deps" != "(none)" ]; then
                apk add --no-cache $deps > /dev/null 2>&1 || \
                  echo "::warning::declared deps not all installable: $deps"
              fi
              make "tools/${{ matrix.tool }}" "TARGET=${{ matrix.target }}"
            '
          sudo chown -R "$(id -u):$(id -g)" dist build 2>/dev/null || true

      - name: sdk probe
        # Three lines that must work before a 40-minute build starts, and fail
        # in 90 s if they do not. When the Mach-O jobs hung for an hour this
        # was the missing evidence: xcrun, not the recipe.
        if: matrix.family == 'macho'
        timeout-minutes: 8
        run: |
          set -x
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          printf 'int main(void){return 0;}\n' > /tmp/probe.c
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=15.0 -o /tmp/probe /tmp/probe.c
          file /tmp/probe
          python3 scripts/checkbin.py /tmp/probe

      - name: build (native)
        if: matrix.family != 'elf'
        env:
          SB_JOBS: '2'
        run: make "tools/${{ matrix.tool }}" TARGET="${{ matrix.target }}"

      - name: verify
        run: python3 scripts/verify.py --all

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/${{ matrix.tool }}-*
          if-no-files-found: error

  compose:
    # Universal carriers need both slices; this job only repacks, it never
    # rebuilds, so it costs seconds.
    needs: [plan, build]
    if: needs.plan.outputs.compose_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.compose) }}
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist-slices
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: stubs-macos
          path: build/stub
      - run: |
          sh scripts/stub-build.sh ${{ matrix.target }} || true
          if [ -f build/stub/sb-stub-macos-arm64 ] && [ ! -f build/stub/sb-stub-macos-universal ]; then
            lipo -create -output build/stub/sb-stub-macos-universal \
              build/stub/sb-stub-macos-arm64 build/stub/sb-stub-macos-x86_64 || true
          fi
      - name: compose
        run: |
          set -eu
          mkdir -p dist
          for tool in $(echo "${{ matrix.tools }}" | tr ',' ' '); do
            version=$(python3 -c "import json;m=json.load(open('manifest/tools.json'));print([t['version'] for t in m['tools'] if t['id']=='$tool'][0])")
            set -- dist-slices/$tool-$version-*
            [ "$#" -gt 0 ] || { echo "skip $tool: no slices"; continue; }
            python3 scripts/compose.py --target "${{ matrix.target }}" --tool "$tool" \
              --version "$version" --stub "build/stub/sb-stub-${{ matrix.target }}" \
              --out "dist/$tool-$version-${{ matrix.target }}" "$@" || echo "compose failed for $tool"
          done
          ls -l dist
      - name: verify
        run: python3 scripts/verify.py --all --tier-only
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: warn
