name: build

# One job per (tool, target). The matrix comes from manifest/tools.json via
# scripts/matrix.py, so adding an architecture is a manifest edit and nothing
# else. Three runner families: ubuntu (ELF, in an alpine container), windows
# (PE) and macos (Mach-O, iOS). Universal files are composed from the slices
# afterwards rather than rebuilt.
on:
  push:
    branches: [main]
    paths: ['recipes/**', 'stub/**', 'scripts/**', 'tools/**', 'manifest/**',
            '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      statuses:
        description: 'statuses to build (ga or ga,experimental)'
        type: string
        default: 'ga'
      ids:
        description: 'comma-separated tool ids (empty = all)'
        type: string
        default: ''

concurrency:
  group: build-${{ github.ref }}-${{ inputs.ids || 'all' }}-${{ inputs.statuses || 'ga' }}
  cancel-in-progress: true

env:
  SOURCE_DATE_EPOCH: '1700000000'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.m.outputs.cells }}
      compose: ${{ steps.c.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          set -eu
          python3 scripts/matrix.py --all --status "${{ inputs.statuses || 'ga' }}" \
            --ids "${{ inputs.ids || '' }}" > /tmp/cells.json
          python3 -c "import json;d=json.load(open('/tmp/cells.json'));print(len(d['include']),'cells')"
          echo "cells=$(tr -d '\n' < /tmp/cells.json)" >> "$GITHUB_OUTPUT"
      - id: c
        run: |
          set -eu
          python3 scripts/matrix.py --compose --status "${{ inputs.statuses || 'ga' }}" \
            --ids "${{ inputs.ids || '' }}" > /tmp/compose.json
          echo "compose=$(tr -d '\n' < /tmp/compose.json)" >> "$GITHUB_OUTPUT"

  stubs:
    # The carrier is pure Go, CGO off: one host cross-builds every ELF and PE
    # stub, including windows-arm64 and windows-386.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: sh scripts/stub-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stubs-linux
          path: build/stub/sb-stub-*
          if-no-files-found: error

  stubs-macos:
    # Mach-O carriers plus the fat carrier for macos-universal.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: sh scripts/stub-build.sh macos-arm64 macos-x86_64 || true
      - run: |
          if [ -f build/stub/sb-stub-macos-arm64 ] && [ -f build/stub/sb-stub-macos-x86_64 ]; then
            lipo -create -output build/stub/sb-stub-macos-universal \
              build/stub/sb-stub-macos-arm64 build/stub/sb-stub-macos-x86_64
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stubs-macos
          path: build/stub/sb-stub-*
          if-no-files-found: warn

  build:
    # stubs-macos is deliberately not a dependency: a macOS cell builds its own
    # carrier locally (it is the only place that can), and blocking the whole
    # matrix on one slow runner would idle 150 jobs.
    needs: [plan, stubs]
    if: needs.plan.outputs.cells != ''
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.cells) }}
    runs-on: ${{ matrix.runs_on }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      # ELF cells build inside `docker run`, not with `container:`. GitHub's
      # JavaScript actions refuse to start in an Alpine container on an arm64
      # runner ("only supported on x64 Linux runners"), so the matrix drives
      # docker itself and only the build step is containerised.
      - name: Build in container (ELF)
        if: matrix.family == 'elf'
        run: |
          set -eu
          IMAGE="${{ matrix.image || 'alpine:3.21' }}"
          case "$IMAGE" in
            alpine*)
              DEPS="apk add --no-cache build-base cmake ninja python3 curl git xz zstd tar unzip bash linux-headers pkgconf openssl-dev zlib-dev go" ;;
            *)
              DEPS="apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake ninja-build python3 curl git xz-utils zstd unzip pkg-config libssl-dev zlib1g-dev golang-go" ;;
          esac
          docker run --rm -v "$PWD:/w" -w /w \
            -e SB_JOBS=3 -e SB_SKIP_VERIFY=1 -e SOURCE_DATE_EPOCH=1700000000 \
            "$IMAGE" sh -c "$DEPS >/dev/null 2>&1; make tools/${{ matrix.tool }} TARGET=${{ matrix.target }}"

      - name: Toolchain (Windows)
        if: startsWith(matrix.runs_on, 'windows')
        shell: bash
        run: |
          choco install -y mingw make zip --no-progress || true
          echo "C:/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-go@v5
        if: matrix.family != 'elf'
        with:
          go-version: '1.23'

      - name: Build (native)
        if: matrix.family != 'elf'
        shell: bash
        env:
          SB_JOBS: '3'
          SB_SKIP_VERIFY: '1'
        run: make "tools/${{ matrix.tool }}" TARGET="${{ matrix.target }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tier (from any host)
        shell: bash
        run: |
          set -eu
          shopt -s nullglob
          files=(dist/${{ matrix.tool }}-${{ matrix.version }}-${{ matrix.target }}*)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no artefact produced"; exit 1; fi
          python3 -m pip install --quiet zstandard || true
          python3 scripts/verify.py --tier-only "${files[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.tool }}-${{ matrix.version }}-${{ matrix.target }}*
          if-no-files-found: warn
          retention-days: 14

  compose:
    needs: [plan, build]
    if: needs.plan.outputs.compose != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.compose) }}
    runs-on: ${{ matrix.runs_on }}
    name: compose-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: ${{ startsWith(matrix.target, 'macos') && 'stubs-macos' || 'stubs-linux' }}
          path: build/stub
      - name: Compose
        shell: bash
        run: |
          set -eu
          chmod +x build/stub/sb-stub-* || true
          case "${{ matrix.target }}" in
            macos-universal)   slices="macos-arm64 macos-x86_64" ;;
            windows-universal) slices="windows-x86_64 windows-arm64" ;;
            *) echo "unknown universal target"; exit 1 ;;
          esac
          for tool in $(echo '${{ matrix.tools }}' | tr ',' ' '); do
            files=""
            for s in $slices; do
              f=$(ls artifacts/"$tool"-*-"$s" 2>/dev/null | grep -v '\.sha256$' | head -1 || true)
              if [ -z "$f" ]; then files=""; break; fi
              files="$files $f"
            done
            [ -n "$files" ] || { echo "skip $tool: a slice is missing"; continue; }
            ver=$(basename $(echo $files | awk '{print $1}') | sed "s/^$tool-//; s/-[^-]*-[^-]*$//")
            python3 scripts/compose.py --target "${{ matrix.target }}" --tool "$tool" \
              --version "$ver" --stub "build/stub/sb-stub-${{ matrix.target }}" \
              --out "dist/$tool-$ver-${{ matrix.target }}" $files
          done
      - uses: actions/upload-artifact@v4
        with:
          name: universal-${{ matrix.target }}
          path: dist/*
          if-no-files-found: warn
