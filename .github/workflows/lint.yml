name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/matrix.py --check
      - name: every tool has a recipe and every recipe a manifest entry
        run: |
          python3 - <<'PY'
          import json, os
          m = json.load(open("manifest/tools.json"))
          ids = {t["id"] for t in m["tools"]}
          files = {f[:-3] for f in os.listdir("recipes") if f.endswith(".sh") and not f.startswith("_")}
          missing = sorted(ids ^ files)
          if missing:
              raise SystemExit("manifest/recipe mismatch: " + ", ".join(missing))
          print(f"{len(ids)} tools, manifest and recipes agree")
          PY
      - name: targets referenced by the manifest exist
        run: python3 scripts/matrix.py --check

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning recipes/*.sh scripts/*.sh

  stub:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: cd stub && go vet ./... && go build -trimpath -o /tmp/sb-stub .
      - name: bundle round-trip
        run: |
          mkdir -p /tmp/tree/bin /tmp/tree/.sb
          printf '#!/bin/sh\necho hello-from-bundle\n' > /tmp/tree/bin/hello
          chmod +x /tmp/tree/bin/hello
          cat > /tmp/tree/.sb/meta.json <<'JSON'
          {"tool":"hello","version":"1.0","entry":"bin/hello","paths":["bin"]}
          JSON
          sudo apt-get install -y zstd
          python3 scripts/pack.py --stub /tmp/sb-stub --root /tmp/tree --out /tmp/hello-bundle
          /tmp/hello-bundle
          /tmp/hello-bundle --sb-version
          out=$(/tmp/hello-bundle --sb-print-meta | python3 -c 'import json,sys;print(json.load(sys.stdin)["tool"])')
          test "$out" = hello
      - name: corrupt payload must be rejected
        run: |
          cp /tmp/hello-bundle /tmp/broken
          # flip one byte *inside the payload*, not the stub: the stub is not covered
          # by the payload checksum and flipping it only breaks the code path we test next
          python3 - <<'PY'
          import struct, os
          p = "/tmp/broken"
          size = os.path.getsize(p)
          with open(p, "r+b") as f:
              f.seek(size - 64)
              magic, ver, flags, off, plen, digest, epoch = struct.unpack("<4sHHQQ32sQ", f.read(64))
              assert magic == b"SBX1", "trailer magic missing"
              f.seek(off + 64)
              f.write(bytes([f.read(1)[0] ^ 0xFF]))
          print("corrupted one payload byte")
          PY
          # cold cache: a warm one is keyed by the trailer digest and would
          # legitimately skip the extraction that does the verification
          if SB_CACHE=$(mktemp -d) /tmp/broken; then echo "corruption not detected"; exit 1; fi
          echo "rejected as expected"

      - name: truncated bundle must be rejected
        run: |
          head -c 3000000 /tmp/hello-bundle > /tmp/truncated
          if SB_CACHE=$(mktemp -d) /tmp/truncated; then echo "truncation not detected"; exit 1; fi
          echo "rejected as expected"
